<ion-list *ngIf="type === 'list'">
  <ion-item *ngFor="let item of items">
    <ion-thumbnail slot="start">
      <ion-skeleton-text animated></ion-skeleton-text>
    </ion-thumbnail>
    <ion-label>
      <h3>
        <ion-skeleton-text animated style="width: 50%"></ion-skeleton-text>
      </h3>
      <p>
        <ion-skeleton-text animated style="width: 80%"></ion-skeleton-text>
      </p>
      <p>
        <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
      </p>
    </ion-label>
  </ion-item>
</ion-list>

<div *ngIf="type === 'card'" class="ion-padding">
  <div *ngFor="let item of items" class="ion-margin-bottom">
    <ion-skeleton-text animated style="width: 100%; height: 200px; border-radius: 8px;"></ion-skeleton-text>
    <h2 class="ion-margin-top">
      <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
    </h2>
    <p>
      <ion-skeleton-text animated style="width: 90%"></ion-skeleton-text>
    </p>
  </div>
</div>
