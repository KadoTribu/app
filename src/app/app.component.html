<ion-app>
  <ion-split-pane contentId="main-content" when="md" [disabled]="!(user$ | async)">

    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Menú</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/tabs/home" routerDirection="root" lines="none" detail="false">
              <ion-icon slot="start" name="home"></ion-icon>
              <ion-label>Eventos</ion-label>
            </ion-item>
            <ion-item routerLink="/tabs/contacts" routerDirection="root" lines="none" detail="false">
              <ion-icon slot="start" name="people"></ion-icon>
              <ion-label>Contactos</ion-label>
            </ion-item>
            <ion-item routerLink="/profile" routerDirection="root" lines="none" detail="false">
              <ion-icon slot="start" name="person"></ion-icon>
              <ion-label>Mi Perfil</ion-label>
            </ion-item>

            <ion-item (click)="logout()" button lines="none" detail="false">
              <ion-icon slot="start" name="log-out"></ion-icon>
              <ion-label>Cerrar Sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
